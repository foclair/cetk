include:
  - component: $CI_SERVER_FQDN/foluft/devops/components/pre-commit/pre-commit@0.2.0
    inputs:
      stage: lint
      image: r-harbor.smhi.se/foluft/python:3.12-git-ubi9

stages:
  - lint
  - build
  - test

default:
  image: r-harbor.smhi.se/foluft/python:3.11-gdal34-ubi9
  interruptible: true

variables:
  KUBERNETES_MEMORY_REQUEST: "256Mi"
  KUBERNETES_MEMORY_LIMIT: "256Mi"

build:package:
  stage: build
  extends: .python
  before_script:
    - uv pip install -c requirements-dev.txt build
  script:
    - python -m build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

django:
  extends: .test

migrations:
  extends: .test

test:
  extends: .test
  script:
    - nox -s test -- --cov --durations=20 --junit-xml=junit.xml
  artifacts:
    reports:
      junit: junit.xml
  coverage: /^TOTAL.*\s(\d+)%$/

.python:
  variables:
    UV_CACHE_DIR: ${CI_PROJECT_DIR}/.cache/uv
    UV_LINK_MODE: copy
  cache:
    key: ${CI_JOB_NAME}
    paths:
      - .cache
  after_script:
    - uv cache prune --ci

.test:
  stage: test
  extends: .python
  needs: ["build:package"]
  before_script:
    - uv pip install -c requirements-dev.txt nox
  script:
    - nox -s ${CI_JOB_NAME}
