name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: pre-commit/action@v3.0.1

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install build
        run: uv pip install --system -c requirements-dev.txt build

      - name: Build dist
        run: python -m build

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  test-django:
    name: Django checks
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GDAL dependencies
        run: |
          sudo apt update
          sudo apt install -y gdal-bin libgdal-dev python3-gdal

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Install nox
        run: uv pip install --system -c requirements-dev.txt nox

      - name: Run
        run: nox -s django

  test-migrations:
    name: Migrations
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Install nox
        run: uv pip install --system -c requirements-dev.txt nox

      - name: Run
        run: nox -s migrations
