[build-system]
requires = ["setuptools >= 83.0.0", "setuptools-scm >= 8"]
build-backend = "setuptools.build_meta"

[project]
name = "cetk"
authors = [
  { name = "Christian Asker" },
  { name = "Mattias Jakobsson" },
  { name = "David Segersson" },
  { name = "Eef van Dongen" },
]
maintainers = [
  { name = "FO Luft", email = "foluftadmin@smhi.se" },
]
description = "CLAIRs Emission ToolKit cetk"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [       # Release date  Comment
  "affine<3.0.1",      # 2026-08-28    required by rasterio - support for 3.0.1+ pending
  "django >=6.1",      # 2026-08-05    introduced support for GDAL3.13 - QGIS4.2 depends on GDAL3.13
  "fiona >=1.9.5",     # 2023-10-12    first version with cp312 wheel
  "geopandas >=0.12",  # 2022-10-24    first version with shapely 2 support
  "netCDF4 >=1.6.5",   # 2023-10-25    first version with cp312 wheel
  "numpy >=1.26,<2.5", # 2021-05-10    first version with cp312 wheel, numpy 2.5 not compatible with NetCDF4
  "openpyxl >=3.0.10", # 2021-03-09    required by pandas
  "pandas >=2.1.1",    # 2023-09-20    first version with cp312 wheel
  "pyogrio >=0.7.0",   # 2023-10-25    first version with cp312 wheel
  "rastafari >=0.4.3",
  "rasterio >=1.3.9",  # 2023-10-19    first version with cp312 wheel
  "shapely >=2.0.2",   # 2023-10-12    first version with cp312 wheel
]
dynamic = ["version"]

[project.scripts]
cetk = "cetk.tools.cetk_command:main"
cetkmanage = "cetk.tools.manage:main"

[tool.coverage.run]
source = ["cetk"]
branch = true
omit = [
]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = "tests"
DJANGO_SETTINGS_MODULE = "cetk.settings"
filterwarnings = [
    "error",
    "ignore:numpy\\.ndarray size changed:RuntimeWarning",
    "ignore:CheckConstraint\\.check is deprecated:DeprecationWarning",
]

[tool.ruff.lint]
extend-select = ["I", "RUF100"]

[tool.setuptools.dynamic]
version = { attr = "cetk.__version__" }
