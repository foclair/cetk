[build-system]
requires = ["setuptools >= 77.0.3", "setuptools-scm >= 8"]
build-backend = "setuptools.build_meta"

[project]
name = "cetk"
authors = [
  { name = "Christian Asker" },
  { name = "Mattias Jakobsson" },
  { name = "David Segersson" },
  { name = "Eef van Dongen" },
]
maintainers = [
  { name = "FO Luft", email = "foluftadmin@smhi.se" },
]
description = "CLAIRs Emission ToolKit cetk"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "django==4.2.2",
  "fiona==1.9.6",
  "geopandas==1.0.1",
  "netCDF4==1.6.5",
  "numpy>=1.24.1,<2",
  "openpyxl==3.1.2",
  "pandas==2.0.0",
  "pyogrio==0.9.0",
  "rastafari >=0.4",
  "rasterio==1.3.9",
  "shapely==2.0.4",
]
dynamic = ["version"]

[project.scripts]
cetk = "cetk.tools.cetk_command:main"
cetkmanage = "cetk.tools.manage:main"

[tool.coverage.run]
source = ["cetk"]
branch = true
omit = [
]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = "tests"
DJANGO_SETTINGS_MODULE = "cetk.settings"
filterwarnings = [
    "error",
    "ignore:numpy\\.ndarray size changed:RuntimeWarning",
    "ignore:np\\.find_common_type is deprecated:DeprecationWarning",
]

[tool.ruff.lint]
extend-select = ["I", "RUF100"]

[tool.setuptools.dynamic]
version = { attr = "cetk.__version__" }

[tool.setuptools_scm]
