[build-system]
requires = ["setuptools >= 84.1.0", "setuptools-scm >= 8"]
build-backend = "setuptools.build_meta"

[project]
name = "cetk"
authors = [
  { name = "Christian Asker" },
  { name = "Mattias Jakobsson" },
  { name = "David Segersson" },
  { name = "Eef van Dongen" },
]
maintainers = [
  { name = "FO Luft", email = "foluftadmin@smhi.se" },
]
description = "CLAIRs Emission ToolKit cetk"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [            # Release date  Comment
  "affine>=3.0.0",          # 2026-08-28
  "django >=6.1",           # 2026-08-05    introduced support for GDAL3.13 - QGIS4.2 depends on GDAL3.13
  "fiona >=1.9.5",          # 2023-10-12    first version with cp312 wheel
  "geopandas >=0.14.3",     # 2024-01-31
  "netCDF4 >=1.7.1.post1",  # 2024-06-13
  "numpy >=2.0.2",          # 2024-08-26
  "openpyxl >=3.1.5",       # 2024-06-28
  "pandas >=2.2.2",         # 2024-04-10
  "pyogrio >=0.8.0",        # 2024-05-07
  "rastafari >=0.4.4",      # 2026-11-05
  "rasterio >=1.3.10",      # 2024-04-12
  "shapely >=2.0.4",        # 2024-04-17
]
dynamic = ["version"]

[project.scripts]
cetk = "cetk.tools.cetk_command:main"
cetkmanage = "cetk.tools.manage:main"

[tool.coverage.run]
source = ["cetk"]
branch = true
omit = [
]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = "tests"
DJANGO_SETTINGS_MODULE = "cetk.settings"
filterwarnings = [
    "error",
    "ignore:numpy\\.ndarray size changed:RuntimeWarning",
    "ignore:CheckConstraint\\.check is deprecated:DeprecationWarning",
]

[tool.ruff.lint]
extend-select = ["I", "RUF100"]

[tool.setuptools.dynamic]
version = { attr = "cetk.__version__" }
